<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INSURE</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Karla:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <div class="container header-container">
      <img src="./INSURE.svg" alt="Insure Logo" class="logo">
      <nav class="nav">
        <a href="#">HOW WE WORK</a>
        <a href="#">BLOG</a>
        <a href="#">ACCOUNT</a>
        <button class="nav-btn">VIEW PLANS</button>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-container">
      <div class="hero-text">
        <h1>Humanizing your insurance.</h1>
        <p>Get your life insurance coverage easier and faster. We blend our expertise and technology to help you find the plan that’s right for you. Ensure you and your loved ones are protected.</p>
        <button class="outline-btn">VIEW PLANS</button>
      </div>
      <div class="hero-img">
        <img src="./Bitmap.png" alt="Hero Image">
      </div>
    </div>
  </section>

  <section class="different">
    <div class="container">
      <h2>We’re different</h2>
      <img class="features" src="./Group 16.png" alt="Features Image">
    </div>
  </section>

  <section class="cta">
    <div class="container cta-container">
      <h2>Find out more about how we work</h2>
      <button class="white-btn">HOW WE WORK</button>
    </div>
  </section>

  <footer>
    <div class="container">
      <img src="./Group 21.png" alt="Footer Layout" class="footer-img">
    </div>
  </footer>

</body>
</html>
